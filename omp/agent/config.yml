providers: 
  webSearchOrder: 
    - searxng
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
symbolPreset: nerd
theme: 
  dark: titanium
setupVersion: 1
modelRoles: 
  default: openai-codex/gpt-5.6-luna:max
  smol: minimax-code/MiniMax-M3
  slow: openai-codex/gpt-5.6-luna:max
  vision: minimax-code/MiniMax-M3
  plan: openai-codex/gpt-5.6-luna:max
  advisor: minimax-code/MiniMax-M3
  commit: minimax-code/MiniMax-M3:off
  task: openai-codex/gpt-5.6-luna:max
  tiny: minimax-code/MiniMax-M3:off
  designer: opencode-go/glm-5.2:max
advisor: 
  enabled: false
  syncBacklog: "1"
  immuneTurns: 5
hideThinkingBlock: false
github: 
  enabled: true
defaultThinkingLevel: auto
cycleOrder: 
  - smol
  - default
  - slow
  - default2
colorBlindMode: false
display: 
  shimmer: classic
  showTokenUsage: false
task: 
  eager: preferred
  isolation: 
    mode: auto
    commits: generic
    merge: patch
commands: 
  enableOpencodeUser: true
edit: 
  mode: hashline
disabledExtensions: 
  - rule:rs-lazylock
  - rule:rs-match-ergonomics
  - rule:rs-parking-lot
  - rule:rs-result-type
  - rule:go-add-cleanup
  - rule:go-bench-loop
  - rule:go-exp-promoted
  - rule:go-ioutil
  - rule:go-join-hostport
  - rule:go-new-expr
  - rule:go-rand-v2
  - rule:go-range-int
  - rule:rs-box-leak
  - rule:rs-future-prelude
browser: 
  headless: true
  enabled: true
compaction: 
  strategy: context-full
  thresholdPercent: -1
  thresholdTokens: 200000
  handoffSaveToDisk: false
exa: 
  enableResearcher: false
textVerbosity: medium
tier: 
  openai: none
personality: default
interruptMode: immediate
contextPromotion: 
  enabled: false
branchSummary: 
  enabled: false
memory: 
  backend: hindsight
hindsight: 
  bankId: default
lsp: 
  formatOnWrite: true
debug: 
  enabled: true
secrets: 
  enabled: false
todo: 
  reminders: true
bashInterceptor: 
  enabled: false
shellMinimizer: 
  sourceOutlineLevel: default
dev: 
  autoqaConsent: granted
statusLine: 
  preset: compact
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
terminal: 
  showProgress: false
searxng: 
  endpoint: http://127.0.0.1:8889