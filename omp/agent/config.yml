providers: 
  webSearchOrder: 
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
    - searxng
  webSearchExclude: 
    - codex
symbolPreset: nerd
theme: 
  dark: titanium
setupVersion: 1
modelRoles: 
  default: omniroute/codex/gpt-5.6-luna:max
  vision: omniroute/vision
  tiny: omniroute/cmd/deepseek/deepseek-v4-flash
  designer: omniroute/disign
  smol: omniroute/cmd/deepseek/deepseek-v4-flash
  slow: omniroute/codex/gpt-5.6-luna-xhigh
  task: omniroute/cmd/deepseek/deepseek-v4-flash:xhigh
  advisor: omniroute/cmd/deepseek/deepseek-v4-flash:xhigh
advisor: 
  enabled: false
  syncBacklog: "1"
  immuneTurns: 5
hideThinkingBlock: false
github: 
  enabled: false
defaultThinkingLevel: max
cycleOrder: 
  - smol
  - default
  - slow
colorBlindMode: false
display: 
  shimmer: classic
  showTokenUsage: false
task: 
  eager: preferred
  isolation: 
    mode: auto
    commits: generic
    merge: patch
  enableLsp: true
commands: 
  enableOpencodeUser: false
  enableOpencodeProject: false
  enableClaudeProject: false
  enableClaudeUser: false
edit: 
  mode: hashline
disabledExtensions: 
  - rule:rs-lazylock
  - rule:rs-match-ergonomics
  - rule:rs-parking-lot
  - rule:rs-result-type
  - rule:go-add-cleanup
  - rule:go-bench-loop
  - rule:go-exp-promoted
  - rule:go-ioutil
  - rule:go-join-hostport
  - rule:go-new-expr
  - rule:go-rand-v2
  - rule:go-range-int
  - rule:rs-box-leak
  - rule:rs-future-prelude
browser: 
  headless: true
  enabled: true
compaction: 
  strategy: context-full
  thresholdPercent: -1
  thresholdTokens: 200000
  handoffSaveToDisk: true
  midTurnEnabled: true
  enabled: true
  supersedeReads: true
exa: 
  enableResearcher: false
textVerbosity: medium
tier: 
  openai: none
personality: default
interruptMode: immediate
contextPromotion: 
  enabled: false
branchSummary: 
  enabled: false
memory: 
  backend: mnemopi
hindsight: 
  bankId: default
lsp: 
  formatOnWrite: true
debug: 
  enabled: true
secrets: 
  enabled: false
todo: 
  reminders: true
bashInterceptor: 
  enabled: false
shellMinimizer: 
  sourceOutlineLevel: default
dev: 
  autoqaConsent: granted
statusLine: 
  preset: default
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
terminal: 
  showProgress: false
searxng: 
  endpoint: http://127.0.0.1:8889
plan: 
  defaultOnStartup: false
includeModelInPrompt: true
includeWorkspaceTree: false
retry: 
  modelFallback: true
  usageAwareFallback: false
  fallbackChains: 
    smol: 
      - omniroute/opencode-go/deepseek-v4-flash
      - omniroute/minimax-m3
    slow: 
      - omniroute/ollama-cloud/glm-5.2
      - omniroute/neuralwatt/glm-5.2
    tiny: 
      - omniroute/opencode-go/deepseek-v4-flash
      - omniroute/minimax/MiniMax-M3
    advisor: 
      - omniroute/opencode-go/deepseek-v4-flash
    default: 
      - ollama-cloud/glm-5.2
      - omniroute/neuralwatt/glm-5.2
    task: 
      - omniroute/opencode-go/deepseek-v4-flash
      - omniroute/ollama-cloud/deepseek-v4-flash
mnemopi: 
  embeddingVariant: multilingual
ttsr: 
  contextMode: discard
features: 
  unexpectedStopDetection: true