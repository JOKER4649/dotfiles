services:
  omnigent:
    environment:
      # 仅通过 IAP/SSH tunnel 访问；不公开服务端口。
      OMNIGENT_AUTH_ENABLED: "0"
      OMNIGENT_PUBLIC_SHARING: "off"
      OMNIGENT_SHARING_MODE: "off"

  runner:
    image: ghcr.io/omnigent-ai/omnigent-host:${OMNIGENT_IMAGE_TAG:-v0.10.0}
    restart: unless-stopped
    network_mode: host
    command: ["sh", "-c", "install -d -m 0700 /root/.omnigent /root/.pi/agent /usr/local/lib/omnigent-bin && ln -sf /usr/local/bin/pi-with-safety /usr/local/lib/omnigent-bin/pi && install -m 0600 /runner-config.yaml /root/.omnigent/config.yaml && install -m 0600 /pi-models.json /root/.pi/agent/models.json && exec env PATH=/usr/local/lib/omnigent-bin:$$PATH omni host http://127.0.0.1:6767"]
    environment:
      OPENCODE_API_KEY: "${OPENCODE_API_KEY:-public}"
      OMNIGENT_RUNNER_ENV_PASSTHROUGH: "OPENCODE_API_KEY"
    working_dir: /workspace
    volumes:
      - runner-home:/root
      - runner-work:/workspace
      - ./runner-config.yaml:/runner-config.yaml:ro
      - ./pi-with-safety.sh:/usr/local/bin/pi-with-safety:ro
      - ./pi-models.json:/pi-models.json:ro
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined

volumes:
  runner-home:
  runner-work:
