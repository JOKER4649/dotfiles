use_default_settings: true

general:
  debug: false
  instance_name: "SearXNG (local)"

search:
  # 允許 omp searxng adapter 使用的 JSON 回應格式
  formats:
    - html
    - json
  # 關閉安全搜尋過濾（omp 用於工程 / 程式查詢）
  safe_search: 0
  autocomplete: ""

server:
  # 家用單 client（127.0.0.1 → omp），不需要 limiter / valkey
  limiter: false
  image_proxy: false
  # base_url 不需要，本地存取即可

# 上游引擎清單沿用預設（use_default_settings: true）
# 若要排除不穩定的引擎（例如 Google 常被擋），可在 engines: 區塊個別 disabled: false 覆寫
